[package]
name = "clarus"
version = "0.1.0"
edition = "2021"
description = "clarus: inference / evaluation engine for image-restoration networks (Rust core, embedded Python model worker)"

[[bin]]
name = "clarus"
path = "src/main.rs"

[dependencies]
png = "0.18.1"
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
